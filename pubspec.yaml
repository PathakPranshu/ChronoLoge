name: chronologe
description: "Let your day write itself."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  envied: ^1.3.8
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geocoding: ^5.0.0
  geolocator: ^14.1.1
  http: ^1.6.0
  image_picker: ^1.2.3
  just_audio: ^0.10.6
  latlong2: ^0.10.1
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  record: ^7.1.1
  shared_preferences: ^2.5.5
  sqflite_sqlcipher: ^3.4.1
  table_calendar: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  envied_generator: ^1.3.8

flutter:
  uses-material-design: true
